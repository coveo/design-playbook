<svg viewBox="0 0 840 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="840" height="560" fill="#111726"/>

  <!-- faint dot grid -->
  <g fill="#273044">
    <circle cx="60" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="420" cy="60" r="1.5"/><circle cx="540" cy="60" r="1.5"/><circle cx="660" cy="60" r="1.5"/><circle cx="780" cy="60" r="1.5"/>
    <circle cx="60" cy="170" r="1.5"/><circle cx="180" cy="170" r="1.5"/><circle cx="300" cy="170" r="1.5"/><circle cx="420" cy="170" r="1.5"/><circle cx="540" cy="170" r="1.5"/><circle cx="660" cy="170" r="1.5"/><circle cx="780" cy="170" r="1.5"/>
    <circle cx="60" cy="280" r="1.5"/><circle cx="180" cy="280" r="1.5"/><circle cx="300" cy="280" r="1.5"/><circle cx="420" cy="280" r="1.5"/><circle cx="540" cy="280" r="1.5"/><circle cx="660" cy="280" r="1.5"/><circle cx="780" cy="280" r="1.5"/>
    <circle cx="60" cy="390" r="1.5"/><circle cx="180" cy="390" r="1.5"/><circle cx="300" cy="390" r="1.5"/><circle cx="420" cy="390" r="1.5"/><circle cx="540" cy="390" r="1.5"/><circle cx="660" cy="390" r="1.5"/><circle cx="780" cy="390" r="1.5"/>
    <circle cx="60" cy="500" r="1.5"/><circle cx="180" cy="500" r="1.5"/><circle cx="300" cy="500" r="1.5"/><circle cx="420" cy="500" r="1.5"/><circle cx="540" cy="500" r="1.5"/><circle cx="660" cy="500" r="1.5"/><circle cx="780" cy="500" r="1.5"/>
  </g>

  <!-- the raw problem: an irregular dashed blob -->
  <path d="M120 210 C150 150 240 140 280 180 C330 160 360 210 340 260 C370 300 320 360 260 350 C220 390 140 370 130 320 C90 300 95 240 120 210 Z"
        stroke="#f2efe6" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="150" y="272" fill="#8b8b93" font-size="12" letter-spacing="2">PROBLEM (RAW)</text>

  <!-- measurement bracket over the blob -->
  <g stroke="#00adff" stroke-width="1.5">
    <path d="M100 128 V116 H364 V128"/>
    <path d="M232 116 V106"/>
  </g>
  <text x="196" y="98" fill="#00adff" font-size="12" letter-spacing="2">SCOPE?</text>

  <!-- transformation arrow -->
  <g stroke="#f2efe6" stroke-width="1.8">
    <path d="M408 280 H492"/>
    <path d="M482 272 L494 280 L482 288"/>
  </g>

  <!-- the shaped outcome: clean rectangle with corner crosshairs -->
  <rect x="540" y="196" width="204" height="168" rx="4" stroke="#1cebcf" stroke-width="2"/>
  <g stroke="#f2efe6" stroke-width="1.5">
    <path d="M528 196 H552 M540 184 V208"/>
    <path d="M732 196 H756 M744 184 V208"/>
    <path d="M528 364 H552 M540 352 V376"/>
    <path d="M732 364 H756 M744 352 V376"/>
  </g>
  <!-- in-scope hatch chip inside -->
  <rect x="568" y="224" width="64" height="34" rx="3" stroke="#732dfb" stroke-width="1.5"/>
  <path d="M574 252 L596 230 M588 256 L610 234 M602 258 L624 236" stroke="#732dfb" stroke-width="1.2"/>
  <text x="568" y="300" fill="#f2efe6" font-size="12" letter-spacing="2">IN SCOPE</text>
  <text x="568" y="336" fill="#8b8b93" font-size="12" letter-spacing="2">OUT: THE REST</text>

  <!-- dimension line under the rectangle -->
  <g stroke="#8b8b93" stroke-width="1.2">
    <path d="M540 404 H744"/>
    <path d="M540 398 V410 M744 398 V410"/>
  </g>
  <text x="580" y="428" fill="#8b8b93" font-size="12" letter-spacing="2">APPETITE: FIXED</text>

  <!-- title block, engineering drawing style -->
  <g stroke="#39445c" stroke-width="1.2">
    <rect x="588" y="472" width="216" height="52"/>
    <path d="M588 498 H804"/>
    <path d="M700 472 V524"/>
  </g>
  <text x="598" y="490" fill="#8b8b93" font-size="11" letter-spacing="1">FIG. 4.1</text>
  <text x="710" y="490" fill="#8b8b93" font-size="11" letter-spacing="1">SHAPING</text>
  <text x="598" y="516" fill="#8b8b93" font-size="11" letter-spacing="1">SCALE 1:1</text>
  <text x="710" y="516" fill="#8b8b93" font-size="11" letter-spacing="1">REV. A</text>
</svg>
