<svg viewBox="0 0 840 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="840" height="560" fill="#f1ece1"/>

  <!-- faint dot grid -->
  <g fill="#d9d1bf">
    <circle cx="70" cy="70" r="2"/><circle cx="210" cy="70" r="2"/><circle cx="350" cy="70" r="2"/><circle cx="490" cy="70" r="2"/><circle cx="630" cy="70" r="2"/><circle cx="770" cy="70" r="2"/>
    <circle cx="70" cy="490" r="2"/><circle cx="210" cy="490" r="2"/><circle cx="350" cy="490" r="2"/><circle cx="490" cy="490" r="2"/><circle cx="630" cy="490" r="2"/><circle cx="770" cy="490" r="2"/>
  </g>

  <!-- crazy 8s: 4x2 grid of bold frames -->
  <g stroke="#29456e" stroke-width="3.5">
    <rect x="92" y="112" width="148" height="140" rx="6"/>
    <rect x="264" y="112" width="148" height="140" rx="6"/>
    <rect x="436" y="112" width="148" height="140" rx="6"/>
    <rect x="608" y="112" width="148" height="140" rx="6"/>
    <rect x="92" y="288" width="148" height="140" rx="6"/>
    <rect x="264" y="288" width="148" height="140" rx="6"/>
    <rect x="608" y="288" width="148" height="140" rx="6"/>
  </g>
  <!-- winner frame in coral with corner ticks -->
  <rect x="436" y="288" width="148" height="140" rx="6" stroke="#e0684b" stroke-width="5"/>
  <g stroke="#e0684b" stroke-width="3">
    <path d="M422 288 H450 M436 274 V302"/>
    <path d="M570 288 H598 M584 274 V302"/>
    <path d="M422 428 H450 M436 414 V442"/>
    <path d="M570 428 H598 M584 414 V442"/>
  </g>

  <!-- sketches inside each frame: distinct geometric doodles -->
  <g stroke="#8a7f6d" stroke-width="2.5" stroke-linecap="round">
    <!-- 1: stacked bars -->
    <path d="M116 150 H216 M116 176 H188 M116 202 H204 M116 228 H160"/>
    <!-- 2: circle + arrow -->
    <circle cx="316" cy="170" r="26"/>
    <path d="M316 208 V236 M308 226 L316 238 L324 226"/>
    <!-- 3: zigzag flow -->
    <path d="M456 148 H516 V186 H556 V224 H500"/>
    <circle cx="560" cy="148" r="6"/>
    <!-- 4: triangle + dot -->
    <path d="M652 232 L682 148 L712 232 Z"/>
    <circle cx="682" cy="196" r="6"/>
    <!-- 5: concentric arcs -->
    <path d="M120 400 A48 48 0 0 1 216 400"/>
    <path d="M138 400 A30 30 0 0 1 198 400"/>
    <path d="M156 400 A12 12 0 0 1 180 400"/>
    <!-- 6: grid of cells -->
    <rect x="292" y="316" width="92" height="84"/>
    <path d="M292 344 H384 M292 372 H384 M323 316 V400 M354 316 V400"/>
    <!-- 8: crossing diagonals -->
    <path d="M636 316 L728 400 M728 316 L636 400"/>
    <circle cx="682" cy="358" r="11"/>
  </g>
  <!-- 7 (winner): the chosen sketch in blue -->
  <g stroke="#4e86c6" stroke-width="2.8" stroke-linecap="round">
    <rect x="460" y="316" width="56" height="38" rx="4"/>
    <path d="M460 372 H584 M460 392 H548"/>
    <circle cx="548" cy="335" r="12"/>
  </g>
  <!-- vote dots on winner -->
  <g fill="#e9b345">
    <circle cx="542" cy="412" r="6"/><circle cx="558" cy="412" r="6"/><circle cx="574" cy="412" r="6"/>
  </g>

  <!-- dimension line: 8 ideas / 8 minutes -->
  <g stroke="#8a7f6d" stroke-width="2">
    <path d="M92 468 H756"/>
    <path d="M92 460 V476 M756 460 V476"/>
  </g>
  <text x="356" y="494" fill="#8a7f6d" font-size="12" letter-spacing="2">8 IDEAS × 8 MIN</text>

  <!-- header note -->
  <text x="92" y="84" fill="#29456e" font-size="12" letter-spacing="2">FIG. 4.2 — CRAZY 8S, ONE WINNER</text>
</svg>
