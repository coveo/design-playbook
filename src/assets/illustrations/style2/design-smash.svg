<svg viewBox="0 0 840 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="840" height="560" fill="#111726"/>

  <!-- faint dot grid -->
  <g fill="#273044">
    <circle cx="70" cy="70" r="1.5"/><circle cx="210" cy="70" r="1.5"/><circle cx="350" cy="70" r="1.5"/><circle cx="490" cy="70" r="1.5"/><circle cx="630" cy="70" r="1.5"/><circle cx="770" cy="70" r="1.5"/>
    <circle cx="70" cy="490" r="1.5"/><circle cx="210" cy="490" r="1.5"/><circle cx="350" cy="490" r="1.5"/><circle cx="490" cy="490" r="1.5"/><circle cx="630" cy="490" r="1.5"/><circle cx="770" cy="490" r="1.5"/>
  </g>

  <!-- crazy 8s: 4x2 grid of frames -->
  <g stroke="#f2efe6" stroke-width="1.8">
    <rect x="92" y="112" width="148" height="140" rx="4"/>
    <rect x="264" y="112" width="148" height="140" rx="4"/>
    <rect x="436" y="112" width="148" height="140" rx="4"/>
    <rect x="608" y="112" width="148" height="140" rx="4"/>
    <rect x="92" y="288" width="148" height="140" rx="4"/>
    <rect x="264" y="288" width="148" height="140" rx="4"/>
    <rect x="608" y="288" width="148" height="140" rx="4"/>
  </g>
  <!-- winner frame in cyan with corner ticks -->
  <rect x="436" y="288" width="148" height="140" rx="4" stroke="#00adff" stroke-width="2.4"/>
  <g stroke="#00adff" stroke-width="2">
    <path d="M424 288 H448 M436 276 V300"/>
    <path d="M572 288 H596 M584 276 V300"/>
    <path d="M424 428 H448 M436 416 V440"/>
    <path d="M572 428 H596 M584 416 V440"/>
  </g>

  <!-- sketches inside each frame: distinct geometric doodles -->
  <g stroke="#8b8b93" stroke-width="1.6">
    <!-- 1: stacked bars -->
    <path d="M116 150 H216 M116 176 H188 M116 202 H204 M116 228 H160"/>
    <!-- 2: circle + arrow -->
    <circle cx="316" cy="170" r="26"/>
    <path d="M316 208 V236 M308 226 L316 238 L324 226"/>
    <!-- 3: zigzag flow -->
    <path d="M456 148 H516 V186 H556 V224 H500"/>
    <circle cx="560" cy="148" r="5"/>
    <!-- 4: triangle + dot -->
    <path d="M652 232 L682 148 L712 232 Z"/>
    <circle cx="682" cy="196" r="5"/>
    <!-- 5: concentric arcs -->
    <path d="M120 400 A48 48 0 0 1 216 400"/>
    <path d="M138 400 A30 30 0 0 1 198 400"/>
    <path d="M156 400 A12 12 0 0 1 180 400"/>
    <!-- 6: grid of cells -->
    <rect x="292" y="316" width="92" height="84"/>
    <path d="M292 344 H384 M292 372 H384 M323 316 V400 M354 316 V400"/>
    <!-- 8: crossing diagonals -->
    <path d="M636 316 L728 400 M728 316 L636 400"/>
    <circle cx="682" cy="358" r="10"/>
  </g>
  <!-- 7 (winner): the chosen sketch in cyan -->
  <g stroke="#00adff" stroke-width="1.8">
    <rect x="460" y="316" width="56" height="38" rx="3"/>
    <path d="M460 372 H584 M460 392 H548"/>
    <circle cx="548" cy="335" r="12"/>
  </g>
  <!-- vote dots on winner -->
  <g fill="#732dfb">
    <circle cx="556" cy="412" r="5"/><circle cx="570" cy="412" r="5"/><circle cx="542" cy="412" r="5"/>
  </g>

  <!-- dimension line: 8 ideas / 8 minutes -->
  <g stroke="#8b8b93" stroke-width="1.2">
    <path d="M92 468 H756"/>
    <path d="M92 462 V474 M756 462 V474"/>
  </g>
  <text x="356" y="492" fill="#8b8b93" font-size="12" letter-spacing="2">8 IDEAS × 8 MIN</text>

  <!-- header note -->
  <text x="92" y="84" fill="#8b8b93" font-size="12" letter-spacing="2">FIG. 4.2 — CRAZY 8S, ONE WINNER</text>
</svg>
