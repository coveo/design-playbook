<svg viewBox="0 0 840 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="840" height="560" fill="#f2efe6"/>

  <!-- the eight ideas: bold distinct glyphs, loose 4x2 field -->
  <circle cx="130" cy="160" r="42" fill="#1371ec"/>
  <path d="M258 202 L300 118 L342 202 Z" fill="#16121f"/>
  <path d="M430 118 A42 42 0 0 1 430 202 Z" fill="#732dfb"/>
  <rect x="548" y="126" width="72" height="72" fill="#1cebcf" transform="rotate(12 584 162)"/>

  <rect x="96" y="330" width="68" height="68" fill="#16121f"/>
  <path d="M262 398 A40 40 0 0 1 342 398" stroke="#1371ec" stroke-width="16"/>
  <g fill="#732dfb">
    <circle cx="416" cy="344" r="9"/><circle cx="448" cy="344" r="9"/>
    <circle cx="416" cy="376" r="9"/><circle cx="448" cy="376" r="9"/>
    <circle cx="416" cy="408" r="9"/><circle cx="448" cy="408" r="9"/>
  </g>
  <path d="M552 336 H624 M588 336 V408 M560 408 H616" stroke="#16121f" stroke-width="14" stroke-linecap="round"/>

