  <!-- rule + labels -->
  <path d="M64 486 H776" stroke="#16121f" stroke-width="3"/>
  <text x="64" y="524" fill="#16121f" font-size="14" letter-spacing="4">EIGHT BAD IDEAS</text>
  <text x="580" y="524" fill="#16121f" font-size="14" letter-spacing="4">ONE GOOD ONE</text>
</svg>
