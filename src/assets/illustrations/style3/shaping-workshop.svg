<svg viewBox="0 0 840 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="840" height="560" fill="#f2efe6"/>

  <!-- the amorphous problem: big ink circle -->
  <circle cx="300" cy="270" r="170" fill="#16121f"/>

  <!-- constraint wedge cutting in from the right -->
  <path d="M470 270 L300 175 V365 Z" fill="#f2efe6"/>
  <path d="M470 270 L316 184 V356 Z" fill="#732dfb"/>

  <!-- halftone field: what gets cut away -->
  <g fill="#16121f">
    <circle cx="118" cy="470" r="7"/><circle cx="150" cy="470" r="6"/><circle cx="182" cy="470" r="5"/><circle cx="214" cy="470" r="4"/><circle cx="246" cy="470" r="3"/><circle cx="278" cy="470" r="2.2"/>
    <circle cx="118" cy="500" r="6"/><circle cx="150" cy="500" r="5"/><circle cx="182" cy="500" r="4"/><circle cx="214" cy="500" r="3"/><circle cx="246" cy="500" r="2.2"/>
    <circle cx="118" cy="530" r="5"/><circle cx="150" cy="530" r="4"/><circle cx="182" cy="530" r="3"/><circle cx="214" cy="530" r="2.2"/>
  </g>

  <!-- the shaped outcome: precise small square, teal -->
  <rect x="590" y="216" width="108" height="108" fill="#1cebcf"/>
  <rect x="614" y="240" width="60" height="60" fill="#f2efe6"/>

  <!-- direction bar -->
  <rect x="470" y="262" width="120" height="16" fill="#16121f"/>

  <!-- top rule + labels -->
  <path d="M64 84 H776" stroke="#16121f" stroke-width="3"/>
  <text x="64" y="64" fill="#16121f" font-size="14" letter-spacing="4">EVERYTHING IT COULD BE</text>
  <text x="560" y="64" fill="#16121f" font-size="14" letter-spacing="4">WHAT IT WILL BE</text>
  <text x="590" y="368" fill="#16121f" font-size="12" letter-spacing="3">FIXED APPETITE</text>
</svg>
