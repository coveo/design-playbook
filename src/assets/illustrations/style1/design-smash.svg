<svg viewBox="0 0 840 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="840" height="560" fill="#f1ece1"/>

  <!-- eight ideas: a family of nested retro arches, one per height -->
  <g stroke-linecap="round" fill="none">
    <path d="M96 560 V300 A150 150 0 0 1 396 300 V560" stroke="#29456e" stroke-width="26"/>
    <path d="M136 560 V300 A110 110 0 0 1 356 300 V560" stroke="#4e86c6" stroke-width="26"/>
    <path d="M176 560 V300 A70 70 0 0 1 316 300 V560" stroke="#74bfae" stroke-width="26"/>
    <path d="M216 560 V300 A30 30 0 0 1 276 300 V560" stroke="#e9b345" stroke-width="26"/>
  </g>
  <g stroke-linecap="round" fill="none">
    <path d="M448 560 V380 A104 104 0 0 1 656 380 V560" stroke="#e0684b" stroke-width="24"/>
    <path d="M484 560 V380 A68 68 0 0 1 620 380 V560" stroke="#e9b345" stroke-width="24"/>
    <path d="M520 560 V380 A32 32 0 0 1 584 380 V560" stroke="#4e86c6" stroke-width="24"/>
  </g>

  <!-- the winner: one arch escapes the family and shoots off the top right -->
  <path d="M552 560 V380 A0 0 0 0 1 552 380" stroke="none"/>
  <path d="M700 560 V220 Q700 150 770 150 H870" stroke="#29456e" stroke-width="26" stroke-linecap="round"/>

  <!-- vote dots on the winner -->
  <g fill="#e0684b">
    <circle cx="742" cy="108" r="8"/><circle cx="768" cy="108" r="8"/><circle cx="794" cy="108" r="8"/>
  </g>

  <!-- retro sun above the idea families -->
  <circle cx="246" cy="170" r="34" fill="#e0684b"/>
  <circle cx="246" cy="170" r="16" fill="#f1ece1"/>

  <!-- labels -->
  <text x="96" y="84" fill="#29456e" font-size="13" letter-spacing="3">MANY IDEAS</text>
  <text x="616" y="84" fill="#29456e" font-size="13" letter-spacing="3">ONE BEST BET</text>
</svg>
