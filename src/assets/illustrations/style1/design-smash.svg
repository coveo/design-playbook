    <circle cx="744" cy="158" r="7" stroke="#1cebcf"/>
    <circle cx="770" cy="222" r="7" stroke="#732dfb"/>
    <circle cx="738" cy="346" r="7" stroke="#00adff"/>
    <circle cx="752" cy="406" r="7" stroke="#1cebcf"/>
    <circle cx="716" cy="464" r="7" stroke="#732dfb"/>
    <circle cx="660" cy="512" r="7" stroke="#8b8b93"/>
  </g>

  <!-- votes on the winner -->
  <g fill="#f2efe6">
    <circle cx="600" cy="264" r="6"/>
    <circle cx="620" cy="264" r="6"/>
    <circle cx="640" cy="264" r="6"/>
  </g>

  <!-- labels -->
  <text x="36" y="248" fill="#8b8b93" font-size="13" letter-spacing="3">ONE PROBLEM</text>
  <text x="262" y="392" fill="#f2efe6" font-size="13" letter-spacing="3">SMASH</text>
  <text x="592" y="244" fill="#8b8b93" font-size="13" letter-spacing="3">VOTES</text>
