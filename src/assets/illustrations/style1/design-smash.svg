    <path d="M300 200 V216"/><path d="M300 344 V360"/>
    <path d="M232 226 L243 237"/><path d="M357 323 L368 334"/>
    <path d="M368 226 L357 237"/><path d="M243 323 L232 334"/>
  </g>

  <!-- eight idea lines fanning out -->
  <path d="M340 248 Q470 130 620 96 H760" stroke="#00adff" stroke-width="9" stroke-linecap="round"/>
  <path d="M346 262 Q490 190 640 158 H744" stroke="#1cebcf" stroke-width="9" stroke-linecap="round"/>
  <path d="M348 274 Q520 236 660 222 H770" stroke="#732dfb" stroke-width="9" stroke-linecap="round"/>
  <path d="M348 288 Q540 292 700 288 H850" stroke="#1371ec" stroke-width="16" stroke-linecap="round"/>
  <path d="M346 300 Q520 330 650 346 H738" stroke="#00adff" stroke-width="9" stroke-linecap="round"/>
  <path d="M342 312 Q500 380 630 406 H752" stroke="#1cebcf" stroke-width="9" stroke-linecap="round"/>
  <path d="M336 322 Q470 430 600 464 H716" stroke="#732dfb" stroke-width="9" stroke-linecap="round"/>
  <path d="M326 330 Q430 470 560 512 H660" stroke="#8b8b93" stroke-width="9" stroke-linecap="round"/>

