<svg viewBox="0 0 840 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="840" height="560" fill="#f1ece1"/>

  <!-- one groovy ribbon: enters tangled (the raw problem), loops, leaves straight (the shape).
       Concentric strokes over the same path make the 70s stripe bundle. -->
  <g stroke-linecap="round" fill="none">
    <path id="r" d="M-30 150 H210 Q330 150 330 270 Q330 380 240 380 Q150 380 150 290 Q150 200 260 200 Q420 200 460 310 Q480 366 560 366 H870"
          stroke="#29456e" stroke-width="64"/>
    <path d="M-30 150 H210 Q330 150 330 270 Q330 380 240 380 Q150 380 150 290 Q150 200 260 200 Q420 200 460 310 Q480 366 560 366 H870"
          stroke="#4e86c6" stroke-width="50"/>
    <path d="M-30 150 H210 Q330 150 330 270 Q330 380 240 380 Q150 380 150 290 Q150 200 260 200 Q420 200 460 310 Q480 366 560 366 H870"
          stroke="#74bfae" stroke-width="36"/>
    <path d="M-30 150 H210 Q330 150 330 270 Q330 380 240 380 Q150 380 150 290 Q150 200 260 200 Q420 200 460 310 Q480 366 560 366 H870"
          stroke="#e9b345" stroke-width="22"/>
    <path d="M-30 150 H210 Q330 150 330 270 Q330 380 240 380 Q150 380 150 290 Q150 200 260 200 Q420 200 460 310 Q480 366 560 366 H870"
          stroke="#e0684b" stroke-width="8"/>
  </g>

  <!-- labels -->
  <text x="48" y="96" fill="#29456e" font-size="13" letter-spacing="3">THE TANGLE</text>
  <text x="642" y="320" fill="#29456e" font-size="13" letter-spacing="3">THE SHAPE</text>

  <!-- retro sun-dot punctuation -->
  <circle cx="700" cy="140" r="26" fill="#e9b345"/>
  <circle cx="700" cy="140" r="12" fill="#f1ece1"/>
</svg>
