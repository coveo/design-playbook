name: CI & Deploy

# Build + content-sync check on every push/PR; deploys to S3 + CloudFront
# (infra: coveo-platform/design-playbook-infra) on main, with per-branch
# preview deploys for PRs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: corepack enable && corepack prepare --activate

      - run: pnpm install --frozen-lockfile

      - name: Check plays.json is committed in sync
        run: |
          pnpm build:plays
          git diff --exit-code packages/design-playbook/public/plays.json || {
            echo "::error::public/plays.json is out of sync with plays/*.mdx — run 'pnpm build:plays' and commit the result."
            exit 1
          }

      - name: Type check
        run: pnpm type-check

      - name: Build
        env:
          BASE_PATH: /design-playbook/
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: packages/design-playbook/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile

      - name: Determine deploy path
        id: path
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "prefix=preview/$HEAD_REF/" >> "$GITHUB_OUTPUT"
            echo "base=/preview/$HEAD_REF/" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE_PATH: ${{ steps.path.outputs.base }}
        run: pnpm build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        env:
          PREFIX: ${{ steps.path.outputs.prefix }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          cd packages/design-playbook
          aws s3 sync dist/ "s3://$S3_BUCKET/$PREFIX" --delete --exclude "preview/*"
          # CloudFront selects cache behaviors on the pre-rewrite URI, so
          # directory URLs rely on origin Cache-Control headers (min_ttl=0
          # honors them) to stay fresh.
          aws s3 cp dist/index.html "s3://$S3_BUCKET/${PREFIX}index.html" --cache-control "no-cache"
          aws s3 cp dist/plays.json "s3://$S3_BUCKET/${PREFIX}plays.json" --cache-control "no-cache"

      - name: Invalidate index + plays.json
        if: github.event_name != 'pull_request'
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/plays.json"

      - name: Post preview link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREFIX: ${{ steps.path.outputs.prefix }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
        with:
          script: |
            const marker = '<!-- playbook-preview -->';
            const url = `https://${process.env.CLOUDFRONT_DOMAIN}/${process.env.PREFIX}`;
            const body = `${marker}\nPreview deployed: ${url}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
