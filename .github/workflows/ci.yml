name: CI

# Build + content checks on every PR. No AWS access, no deploy permissions —
# deploys live in cd.yml (main) and preview.yml (PR previews).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: corepack enable && corepack prepare --activate

      - run: pnpm install --frozen-lockfile

      - name: Check plays.json is committed in sync
        run: |
          pnpm build:plays
          git diff --exit-code packages/design-playbook/public/plays.json || {
            echo "::error::plays.json is out of sync with the plays — run 'pnpm build:plays' and commit the result."
            exit 1
          }

      - name: Type check
        run: pnpm type-check

      - name: Build
        env:
          BASE_PATH: /
        run: pnpm build
