name: Publish MCP server

# Publishes @coveord/design-playbook-mcp from mcp/ on version tags.
# Uses npm trusted publishing (OIDC + provenance) — no long-lived token;
# npm is configured to accept publishes only from this workflow.
on:
  push:
    tags:
      - 'mcp-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        working-directory: packages/mcp
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Publish
        working-directory: packages/mcp
        run: npm publish
